# Keep Cloud Run's client proto (do not overwrite with $scheme; nginx listens on plain HTTP).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Cache-Control for static files, chosen per request URI. Set once at server level
# (not inside locations) so it does not reset the server-level security headers (nosniff, CSP, HSTS), and
# without "always" so error responses (e.g. a 404 for a missing .js) are not cached.
# Hashed bundles never change; everything else (index.html, SPA routes, favicon)
# is revalidated on each visit. /api/ is excluded: the API sets its own header.
# "public" is kept per #121 (docs/superpowers/specs/2026-11-24-static-cache-control-design.md); it also lets a shared cache store responses
# fetched with Authorization, so revisit it before putting a CDN/proxy in front.
# Order matters (first regex match wins): keep the /api/ rule above the js rule.
# The extensions here and in the js/mjs/css location below must stay in sync.
map $uri $static_cache_control {
    default                   "no-cache";
    ~^/api/                   "";
    ~*\.(?:js|mjs|css)$       "public, max-age=31536000, immutable";
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=1r/s;
limit_req_status 429;

# Cloud Run's front end connects from 169.254.0.0/16 (observed: 169.254.169.126 for every
# client) and puts the client IP in X-Forwarded-For. Trust only that hop so $remote_addr
# (limit_req keys, X-Real-IP to the API) is the real client; spoofed left-hand XFF entries
# are skipped by real_ip_recursive. See #171.
set_real_ip_from 169.254.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen ${PORT};
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $static_cache_control;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; worker-src 'self' blob:" always;

    # Cloud Run reserves paths ending in "z" (e.g. /healthz); use /health.
    location = /health {
        auth_basic off;
        default_type text/plain;
        return 200 'ok';
    }

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Attachment uploads allow up to 5 MiB (+ multipart overhead).
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;

    # SPA XHR (esp. mobile Safari) often omits Authorization after the document
    # Basic challenge. App session / app Basic protect /api; edge Basic stays on UI.
    location = /api/auth/login {
        auth_basic off;
        limit_req zone=api_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /api/ {
        auth_basic off;
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }

    # Files that are not on disk must be 404, not index.html: after a deploy the
    # old index.html asks for bundles that no longer exist, and an HTML answer to
    # a script request breaks the page until a hard reload.
    location ~* ^/(?!api/).+\.(?:js|mjs|css)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
