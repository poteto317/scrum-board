name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify deploy image, nginx, dockerignore, and action pin guards
        run: |
          bash -n scripts/check-deploy-image-hardening.sh
          bash -n scripts/check-nginx-tls-headers.sh
          bash -n scripts/check-nginx-gzip.sh
          bash -n scripts/check-nginx-cache.sh
          bash -n scripts/check-nginx-real-ip.sh
          bash -n scripts/check-root-dockerignore.sh
          bash -n scripts/check-workflow-action-pins.sh
          bash -n scripts/check-no-deferred-stylesheet-onload.sh
          bash -n scripts/check-no-gcp-project-fallback.sh
          bash -n scripts/check-deploy-anthropic-optional.sh
          ./scripts/check-deploy-image-hardening.sh
          ./scripts/check-nginx-tls-headers.sh
          ./scripts/check-nginx-gzip.sh
          ./scripts/check-nginx-cache.sh
          ./scripts/check-nginx-real-ip.sh
          ./scripts/check-root-dockerignore.sh
          ./scripts/check-workflow-action-pins.sh
          ./scripts/check-no-deferred-stylesheet-onload.sh
          ./scripts/check-no-gcp-project-fallback.sh
          ./scripts/check-deploy-anthropic-optional.sh
          ./scripts/check-root-dockerignore.sh --selftest
          ./scripts/check-workflow-action-pins.sh --selftest
          ./scripts/check-no-gcp-project-fallback.sh --selftest
          ./scripts/check-nginx-gzip.sh --selftest
          ./scripts/check-nginx-cache.sh --selftest
          ./scripts/check-nginx-real-ip.sh --selftest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
