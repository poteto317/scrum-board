@if (visible()) {
  <button
    type="button"
    class="secondary back-to-top"
    (click)="scrollToTop()"
    (pointerdown)="onPointerDown()"
    (pointerup)="onPointerEnd()"
    (pointercancel)="onPointerEnd()"
    (pointerleave)="onPointerEnd()"
    (focus)="onFocus()"
    (blur)="onBlur()"
  >
    トップに戻る
  </button>
}
