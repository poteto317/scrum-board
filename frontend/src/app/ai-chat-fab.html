@if (showEntry()) {
  <div class="ai-chat-fab-root">
    @if (open()) {
      <div
        #panel
        id="ai-chat-fab-panel"
        class="ai-chat-fab-panel"
        role="dialog"
        aria-modal="false"
        aria-label="AIチャット"
      >
        <header class="ai-chat-fab-header">
          <strong>AIに聞く</strong>
          <div class="ai-chat-fab-header-actions">
            <button
              type="button"
              class="ai-chat-fab-expand"
              (click)="expandToPage()"
              [disabled]="expanding() || chatSending()"
              aria-label="AIチャットを全画面で開く"
            >
              全画面
            </button>
            <button type="button" class="ai-chat-fab-close" (click)="closePanel({ restoreFocus: true })">
              閉じる
            </button>
          </div>
        </header>
        @if (projectId(); as chatProjectId) {
          <div class="ai-chat-fab-body">
            <app-project-ai-chat
              [projectId]="chatProjectId"
              [focusItem]="focusItem()"
              [layout]="'dock'"
              (conversationChange)="onConversationChange($event)"
              (sendingChange)="chatSending.set($event)"
              (descriptionApplied)="onDescriptionApplied($event)"
              (commentApplied)="onCommentApplied()"
            />
          </div>
        }
      </div>
    }
    <button
      #entryBtn
      type="button"
      class="ai-chat-fab-entry"
      (click)="toggle()"
      [attr.aria-expanded]="open() ? 'true' : 'false'"
      aria-controls="ai-chat-fab-panel"
    >
      AIに聞く
    </button>
  </div>
}
