<div
  class="copy-feedback-banner"
  [class.copy-feedback-banner--hidden]="!message"
  [class.copy-feedback-banner--ok]="kind === 'success'"
  [class.copy-feedback-banner--error]="kind === 'failure'"
  role="status"
  aria-live="polite"
>
  @if (kind === 'success') {
    <svg
      class="copy-feedback-banner__icon"
      viewBox="0 0 16 16"
      width="16"
      height="16"
      aria-hidden="true"
      focusable="false"
    >
      <path
        fill="currentColor"
        d="M6.5 11.2 3.3 8l1.1-1.1 2.1 2.1 4.6-4.6L12.2 5.5 6.5 11.2z"
      />
    </svg>
  } @else if (kind === 'failure') {
    <svg
      class="copy-feedback-banner__icon"
      viewBox="0 0 16 16"
      width="16"
      height="16"
      aria-hidden="true"
      focusable="false"
    >
      <path
        fill="currentColor"
        d="M4.1 5.2 6.9 8l-2.8 2.8 1.1 1.1L8 9.1l2.8 2.8 1.1-1.1L9.1 8l2.8-2.8-1.1-1.1L8 6.9 5.2 4.1z"
      />
    </svg>
  }
  <span class="copy-feedback-banner__text">{{ message }}</span>
</div>
