server {
 listen 80;
 server_name _;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; worker-src 'self' blob:" always;
 client_max_body_size 6m;
 gzip on;
 gzip_comp_level 5;
 gzip_min_length 256;
 gzip_vary on;
 gzip_proxied any;
 gzip_types
  text/plain
  text/css
  text/xml
  application/json
  application/javascript
  text/javascript
  application/xml
  image/svg+xml;
 location /api/ {
  proxy_pass http://api:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 60s;
  proxy_buffering on;
  proxy_buffer_size 128k;
  proxy_buffers 8 256k;
  proxy_busy_buffers_size 512k;
 }
 location / {
  try_files $uri $uri/ /index.html;
 }
}
