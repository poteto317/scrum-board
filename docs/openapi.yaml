          description: クリア成功（本文なし）
        '400':
          description: プロジェクト ID が不正（「プロジェクトIDが不正です。」）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトなし（「プロジェクトが見つかりません。」）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: プロジェクト ID
      security:
      - cookieAuth: []
      - basicAuth: []
