                  type: string
                description:
                  type: string
                columnId:
                  type: integer
                projectId:
                  type: integer
                prUrls:
                  type: array
                  items:
                    type: string
                assignee:
                  type: string
                favorite:
                  type: boolean
                solution:
                  type: string
                dueAt:
                  type: string
              additionalProperties: false
  /api/items/by-number/{number}:
    get:
      summary: アイテム詳細（公開番号）
      operationId: get_api_items_by_number_number
      responses:
        '200':
          description: アイテム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
      security: []
      description: セッション Cookie は任意（sessionOptional）。Cookie が無く非 public のアイテムは 401。`viewAccess=public`
        なら未ログインでも閲覧可。Cookie がある場合は ACL に従い 403 もありうる。ハンドラが強制する。
  /api/items/by-number/{number}/assignee:
    patch:
      summary: 対応者変更
      operationId: patch_api_items_by_number_number_assignee
      responses:
        '200':
