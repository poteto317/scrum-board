    delete:
      summary: コマンドテンプレート削除
      operationId: delete_api_command_templates_id
      responses:
        '204':
          description: 削除成功（本文なし）
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
