  /api/projects/{id}/ai-chat:
    get:
      summary: プロジェクト AI チャットの、いちばん新しい会話
      operationId: get_api_projects_id_ai_chat
      description: |
        ログインが必要。呼び出したユーザー自身の、そのプロジェクトでの **いちばん新しい会話**
        （`updatedAt` の降順、同じなら `id` の降順の先頭）と、そのメッセージを古い順に返す。画面を開いたときの最初の表示に使う。
        会話が 1 つも無ければ `conversation` は `null`、`messages` は空の配列。
        履歴は「プロジェクト × ユーザー」ごとの会話に分かれていて、ほかのユーザーのものは返らない。
        会話の一覧は `GET /api/projects/{id}/ai-conversations`。ANTHROPIC_API_KEY 未設定でも返す。
      responses:
        '200':
          description: いちばん新しい会話と、そのメッセージ
          content:
            application/json:
              schema:
                type: object
                required:
                - conversation
                - messages
                properties:
                  conversation:
                    description: 会話が 1 つも無ければ null。
                    oneOf:
                    - $ref: '#/components/schemas/ProjectAIConversation'
                    - type: 'null'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectAIMessage'
                additionalProperties: false
        '400':
          description: プロジェクト ID が不正（「プロジェクトIDが不正です。」）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトなし（「プロジェクトが見つかりません。」）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: プロジェクト ID
      security:
      - cookieAuth: []
      - basicAuth: []
    post:
      summary: プロジェクト AI チャット送信
      operationId: post_api_projects_id_ai_chat
      description: |
        ログインが必要。プロジェクトの中身について質問する。モデルは、サーバーが実行する読み取り専用のツール
        （`search_items`: キーワード・ステータス・ラベル等でアイテム検索、`get_item`: ラベルを含むアイテムを開く）で調べてから答える。既定ではツールの対象は URL のプロジェクトに限り、
        呼び出したユーザーが閲覧できるアイテムだけを返す（ゴミ箱は対象外、アーカイブ済みは含む）。
        `crossProjectSearch: true` のとき、読取ツールだけをアイテム単位の `CanView` を満たす全プロジェクトへ広げる（提案・適用・会話所属は URL プロジェクトのまま）。
        保存するのは、ユーザーのメッセージと最後の回答だけ。失敗したときは履歴に足さない。アイテムは書き換えない。

        `focusItemNumber` は、アイテム詳細から送るときに付ける。URL プロジェクトの番号で引けて、呼び出したユーザーが閲覧できるときだけ、
        タイトル・説明・ラベル・コメントを文脈に入れる（横断オンでも他プロジェクト番号は文脈にしない）。見つからない・閲覧できない・ゴミ箱にあるときは、エラーにせず文脈なしで続ける。

        履歴は会話に分かれている。どの会話に続けるかは、本文で決まる。
        - `conversationId` を付ける: その会話に続ける。呼び出したユーザー自身の、そのプロジェクトの会話でなければ 404
          「会話が見つかりません。」（無い・別のユーザーのもの・別のプロジェクトのもの、を区別しない）。
        - `"newConversation": true`: 新しい会話を作って、そこに保存する。`conversationId` と一緒には指定できない（400）。
        - どちらも付けない（`conversationId` が null、`newConversation` が false も同じ）: いちばん新しい会話に続ける。
          会話が 1 つも無ければ、新しく作る。
        `replaceFromMessageId`（任意・正の整数）を付けると、そのユーザーメッセージ以降を置き換えて再送信する（編集・やり直し）。
        - `conversationId` 必須。`newConversation: true` との併用は 400。
        - 対象は表示中会話の、時系列で最後の user メッセージだけ。メッセージが無い・他ユーザー・他会話・role が user でない・それより新しい user があるときは 400
          「編集対象のメッセージが不正です。」（モデルは呼ばない。履歴は変えない）。
        - モデル入力はメモリ上で `id < replaceFromMessageId` の履歴だけ。モデル失敗・保存失敗では DB を変えない。
        - 成功時のみ、1 トランザクションで `id >= replaceFromMessageId` を削除してから新 user＋新 assistant を保存する（提案は CASCADE 削除）。
        モデルに渡す履歴は、保存先の会話の直近 `AI_CHAT_HISTORY_TURNS` 往復だけ（新しい会話なら履歴なし。ほかの会話の履歴は渡らない。
        `replaceFromMessageId` 指定時は上記の切り詰めた履歴からさらに直近往復）。
        保存先の会話は、モデルを呼ぶ前に決める。モデルを待つ間にその会話が消されたときは、回答を捨てずに、新しい会話として保存する
        （応答の `conversation.id` が、送った `conversationId` と違う）。
        新しい会話のタイトルは、最初のメッセージから作る（空白の並びを 1 つの空白にして、先頭の 40 文字。超えたら末尾に「…」）。
        会話は「プロジェクト × ユーザー」ごとに 100 件まで（新しく作って超えた分は、更新が古い順に消える）。
        1 つの会話のメッセージは 200 件まで（超えた分は古い順に消える）。

        モデルの呼び出しは 1 メッセージにつき最大 4 回。このリクエストだけ、サーバーの制限時間は 50 秒
        （モデルとツールで最大 40 秒。ほかの経路は 15 秒）。

        クライアントが途中で切断しても、サーバーは最後まで実行し、利用量を数え、質問と回答を履歴に保存する。
        その間に同じユーザーが送り直すと 429 `ai_busy` になる。実行が終わってから GET で会話を取ると、回答が入っている。

        エラーの順序: 401 → 415 → 400（本文）→ 400／404（プロジェクト）→ 404（会話）→ 503 → 429 `ai_credit_limit` →
        429 `ai_busy`（同じユーザーのプロジェクトチャットが実行中）→ 429 `ai_rate_limit` → 429 `ai_busy`（同時実行の枠なし）→ 502／500。
        `code` が付くのは 415・429・502 と、500 のうち `server_error`（回答の保存の失敗、ツールの中のデータベースの失敗）、
        503 のうち `ai_not_configured`。モデルを呼ぶ前のデータベースの失敗の 500 と、50 秒の制限時間に達したときの 503
        （「処理がタイムアウトしました。」）は `message` だけ。400・401・404 も `message` だけ。
      responses:
        '200':
          description: 保存先の会話、回答、その会話の更新後のメッセージ全部
          content:
            application/json:
              schema:
                type: object
                required:
                - conversation
                - assistant
                - messages
                properties:
                  conversation:
                    $ref: '#/components/schemas/ProjectAIConversation'
                  assistant:
                    $ref: '#/components/schemas/ProjectAIMessage'
                  messages:
                    type: array
                    description: |
                      `conversation` のメッセージ全部（古い順）。保存の後の読み直しに失敗したときは、わかっている内容から組み立てる
                      （新しい 2 件の `id` は負の仮の値で、`createdAt` はゼロ値）。
                    items:
                      $ref: '#/components/schemas/ProjectAIMessage'
                additionalProperties: false
        '400':
          description: |
            本文が不正（JSON でない、未知のフィールド、メッセージが空・長すぎる・制御文字、focusItemNumber が整数でない・0 以下、
            conversationId が整数でない、newConversation が真偽値でない、replaceFromMessageId が整数でない）、
            conversationId が 0 以下（「会話IDが不正です。」）、
            conversationId と `"newConversation": true` を両方指定（「conversationId と newConversation は同時に指定できません。」）、
            replaceFromMessageId が 0 以下（「replaceFromMessageId は正の整数を指定してください。」）、
            replaceFromMessageId と `"newConversation": true` を両方指定（「replaceFromMessageId と newConversation は同時に指定できません。」）、
            replaceFromMessageId があるのに conversationId が無い（「replaceFromMessageId を指定するときは conversationId が必要です。」）、
            replaceFromMessageId の対象が不正（「編集対象のメッセージが不正です。」。無い・他ユーザー・他会話・role≠user・直前の user でない）、
            またはプロジェクト ID が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            プロジェクトなし（「プロジェクトが見つかりません。」）、または `conversationId` の会話が見つからない
            （「会話が見つかりません。」。別のユーザー・別のプロジェクトの会話も同じ応答）。どちらも 503 より前で、モデルは呼ばない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type が application/json でない（code=unsupported_media_type）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIError'
        '429':
          description: |
            アプリ内トークン上限到達（code=ai_credit_limit）、
            利用者別レート制限超過（code=ai_rate_limit。ユーザーのメッセージ 1 件につき 1 回分）、
            または混雑（code=ai_busy。同じユーザーのプロジェクトチャットが実行中、もしくは全機能で共有する同時実行の枠が無い）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIError'
        '500':
          description: |
            保存の失敗、またはツールの中のデータベースの失敗（code=server_error）。履歴には足さない。
            モデルを呼ぶ前のデータベースの失敗（プロジェクト・会話・列・開いているアイテム・履歴の読み込みなど）は、`code` の無い `message` だけの応答。
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AIError'
                - $ref: '#/components/schemas/Error'
        '502':
          description: モデルの失敗・時間切れ（code=ai_failed）。上流の文言は含めない。履歴には足さない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIError'
        '503':
          description: |
            AI 未設定（code=ai_not_configured）。
            50 秒の制限時間に達したときは、`code` の無い `{"message":"処理がタイムアウトしました。"}`。
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AIError'
                - $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: プロジェクト ID
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  description: |
                    1〜N Unicode 文字（既定 N=4000。サーバーの `AI_CHAT_MESSAGE_MAX` で上書き可）。前後の空白は除く。
                focusItemNumber:
                  description: 開いているアイテムの番号（アイテム詳細から送るときだけ）。省略・null は「なし」。
                  oneOf:
                  - type: integer
                    minimum: 1
                  - type: 'null'
                conversationId:
                  oneOf:
                  - type: integer
                    minimum: 1
                  - type: 'null'
                  description: 続ける会話の ID。省略・null は「指定なし」（`newConversation` も無ければ、いちばん新しい会話に続ける）。`replaceFromMessageId` を付けるときは必須。
                newConversation:
                  type: boolean
                  description: true なら新しい会話を作る。`conversationId` および `replaceFromMessageId` と一緒には指定できない。省略・false は「指定なし」。
                replaceFromMessageId:
                  oneOf:
                  - type: integer
                    minimum: 1
                  - type: 'null'
                  description: |
                    編集・やり直しの起点。正の整数のとき、その user メッセージ（当該会話の直前の user のみ）以降を置き換えて再送信する。
                    `conversationId` 必須。`newConversation` と併用不可。省略・null は通常の追記送信。
                crossProjectSearch:
                  type: boolean
                  description: |
                    true なら読取ツール（search_items / get_item）を閲覧可能な全プロジェクトへ広げる。省略・false は URL プロジェクトのみ。
                    真偽値以外は 400。提案ツールの対象は常に URL プロジェクト。
              additionalProperties: false
