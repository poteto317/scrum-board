components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sb_session
      description: アプリのセッション Cookie（SessionCookieName）。
  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
      additionalProperties: false
    JsonValue:
      description: 当該エンドポイントの JSON 応答。フィールド詳細は必要に応じて本スキーマを具体化する。
    Item:
      type: object
      description: アイテム JSON の主要フィールド。ACL 詳細は PATCH /acl を参照。
      properties:
        id:
          type: integer
        number:
          type: integer
        title:
          type: string
        description:
          type: string
        columnId:
          type: integer
        projectId:
          type: integer
        assignee:
          type: string
        favorite:
          type: boolean
        solution:
          type: string
        dueAt:
          type: string
          description: UTC。未設定は空文字または省略
        closeReason:
          type: string
        viewAccess:
          type: string
          enum:
          - public
          - open
          - restricted
        editAccess:
          type: string
          enum:
          - open
          - restricted
        prUrls:
          type: array
          items:
            type: string
