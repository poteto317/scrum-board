      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonValue'
      description: ' requestBody は暫定 JsonValue。変更時に具体化する。'
  /api/health:
    get:
      summary: 起動確認
      operationId: get_api_health
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
      security: []
      description: セッション Cookie 不要（sessionExempt）。
  /api/items:
    post:
      summary: アイテム作成
      operationId: post_api_items
      responses:
        '201':
          description: 作成されたアイテム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 関連先アイテムの編集権限が無い場合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - columnId
              properties:
                title:
                  type: string
                description:
                  type: string
                columnId:
                  type: integer
                projectId:
                  type: integer
                prUrls:
                  type: array
                  items:
                    type: string
                assignee:
                  type: string
                favorite:
                  type: boolean
                solution:
                  type: string
                dueAt:
                  type: string
              additionalProperties: false
  /api/items/by-number/{number}:
    get:
      summary: アイテム詳細（公開番号）
      operationId: get_api_items_by_number_number
      responses:
        '200':
          description: アイテム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          description: 未ログインかつ非 public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 閲覧権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 対象なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
      security: []
      description: セッション Cookie は任意（sessionOptional）。有効な users Basic（`Sec-Fetch-Site` ヘッダ無し）なら
        `CurrentUser` を付与。無効な Basic または `Sec-Fetch-Site` ありの場合は匿名続行（middleware は 401 にしない）。
        Cookie が無く非 public のアイテムは 401。`viewAccess=public` なら未ログインでも閲覧可。Cookie がある場合は
        ACL に従い 403 もありうる。ハンドラが強制する。
  /api/items/by-number/{number}/assignee:
    patch:
      summary: 対応者変更
      operationId: patch_api_items_by_number_number_assignee
      responses:
        '200':
          description: 更新後のアイテム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - assignee
              properties:
                assignee:
                  type: string
              additionalProperties: false
  /api/items/by-number/{number}/attachments:
    get:
