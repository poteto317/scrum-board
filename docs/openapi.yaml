      operationId: get_api_ai_credits
      description: ログイン済みなら可。usedTokens は input+output の累計。unlimited のとき limitTokens／remainingTokens は null。configured は ANTHROPIC_API_KEY の有無（usage と同じ）。approximate は常に true。
