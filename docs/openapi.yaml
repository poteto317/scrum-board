          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
      security: []
      description: セッション Cookie は任意（sessionOptional）。Cookie が無く非 public のアイテムは 401。`viewAccess=public`
        なら未ログインでも閲覧可。Cookie がある場合は ACL に従い 403 もありうる。ハンドラが強制する。
    post:
      summary: 添付アップロード
      operationId: post_api_items_by_number_number_attachments
      responses:
        '201':
          description: 添付メタ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な multipart／MIME／サイズ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 編集権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: ストレージ未設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - field
              properties:
                file:
                  type: string
                  format: binary
                field:
                  type: string
                  enum:
                  - description
                  - solution
                  - comment
                commentId:
                  type: integer
  /api/items/by-number/{number}/attachments/{id}:
    delete:
      summary: 添付削除
      operationId: delete_api_items_by_number_number_attachments_id
