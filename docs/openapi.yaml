openapi: 3.1.0
info:
  title: Scrum Board API
  version: 0.1.0
  description: 'スクラムかんばん HTTP API の契約正本。本番 nginx の HTTP Basic はゲートウェイ層であり、operation の security には含めない。受け付けない入力は黙って別解釈へ落とさず
    4xx 等で拒否する。v0.1.0: 全 HTTP ルートの paths・認証（exempt/optional/必須）・主要 operation の request/response を載せる。未具体化の応答は
    JsonValue。当該 API を変更するときは update-api-doc スキルに従い JsonValue を具体 schema に置き換える。'
servers:
- url: http://127.0.0.1:4200
  description: ローカル（compose / フロント nginx 経由）。本番 Basic はゲートウェイ層。
paths:
  /api/auth/login:
    post:
      summary: ログイン（セッション Cookie 発行）
      operationId: post_api_auth_login
      responses:
        '200':
          description: 'ログイン成功（Set-Cookie: sb_session）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      description: セッション Cookie 不要（sessionExempt）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - loginName
              - password
              properties:
                loginName:
                  type: string
                password:
                  type: string
              additionalProperties: false
  /api/auth/logout:
    post:
      summary: ログアウト
      operationId: post_api_auth_logout
      responses:
        '204':
          description: ログアウト成功（本文なし。sessionExempt）
      security: []
      description: セッション Cookie 不要（sessionExempt）。
  /api/auth/me:
    get:
      summary: 現在のユーザー
      operationId: get_api_auth_me
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
      security:
      - cookieAuth: []
  /api/backlog:
    get:
      summary: バックログ
      operationId: get_api_backlog
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
      security:
      - cookieAuth: []
  /api/backlog/order:
    put:
      summary: バックログ並び替え
      operationId: put_api_backlog_order
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
  /api/board:
    get:
      summary: ボード（列＋アイテム）
      operationId: get_api_board
      responses:
        '200':
          description: 成功
          content:
