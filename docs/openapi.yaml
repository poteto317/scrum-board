openapi: 3.1.0
info:
  title: Scrum Board API
  version: 0.1.0
  description: 'スクラムかんばん HTTP API の契約正本。アプリ認証は Cookie `sb_session` または HTTP Basic（users テーブルの login_name / password。主に非ブラウザ向けだが、ブラウザの Basic も同じく検証する）のどちらか。本番
    nginx の HTTP Basic はゲートウェイ層であり、operation の security には含めない。受け付けない入力は黙って別解釈へ落とさず 4xx 等で拒否する。v0.1.0:
    全 HTTP ルートの paths・認証（exempt/optional/必須）・主要 operation の request/response を載せる。未具体化の応答は JsonValue。当該 API
    を変更するときは update-api-doc スキルに従い JsonValue を具体 schema に置き換える。'
servers:
- url: http://127.0.0.1:4200
  description: ローカル（compose / フロント nginx 経由）。本番 Basic はゲートウェイ層。
paths:
  /api/admin/repair-doubled-text:
    post:
      summary: 説明・ソリューションの厳密二重本文を修復
      operationId: post_api_admin_repair_doubled_text
      description: >-
        管理者のみ。生存アイテムの description / solution が rune 列でちょうど half+half のとき
        半分に畳む。本番適用前に必ず `dryRun: true` で対象を確認する。
        一覧取得失敗のみ 5xx。個別 Update 失敗は 200 と failedItemIds で部分成功を返す。
        警告件数は warnings 配列の要素数。
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  description: true なら DB を変更せず予定件数のみ返す。省略時は false（適用）。null は 400
              additionalProperties: false
      responses:
        '200':
          description: 走査完了（部分成功を含む）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubledTextRepairResponse'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 一覧取得など走査開始前の失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      summary: ログイン（セッション Cookie 発行）
      operationId: post_api_auth_login
      responses:
        '200':
          description: 'ログイン成功（Set-Cookie: sb_session）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 連続失敗による一時ロック（試行回数が上限）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      description: >-
        セッション Cookie 不要（sessionExempt）。`Content-Type: application/json` 必須。
        `Origin` ヘッダがある場合は PUBLIC_ORIGIN（未設定時はリクエストの origin）と一致すること。
        連続失敗が上限に達すると一時的に 429 を返す。ゲートウェイ（nginx limit_req）の 429 は本文形式がアプリ JSON と異なる場合がある。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - loginName
              - password
              properties:
                loginName:
                  type: string
                password:
                  type: string
              additionalProperties: false
  /api/auth/logout:
    post:
      summary: ログアウト
      operationId: post_api_auth_logout
      responses:
        '204':
          description: ログアウト成功（本文なし。sessionExempt）
      security: []
      description: セッション Cookie 不要（sessionExempt）。
  /api/auth/me:
    get:
      summary: 現在のユーザー
      operationId: get_api_auth_me
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
      security:
      - cookieAuth: []
      - basicAuth: []
  /api/backlog:
    get:
      summary: バックログ
      operationId: get_api_backlog
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: プロジェクトで絞り込む（省略時はワークスペース全体）
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: 前回応答の ETag。一致すれば 304（projectId スコープ別）
      responses:
        '200':
          description: 成功
          headers:
            ETag:
              schema:
                type: string
              description: フィルタ後ボディの強い ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '304':
          description: 未変更（本文なし）。認証要否は 200 と同じ
          headers:
            ETag:
              schema:
                type: string
      security:
      - cookieAuth: []
      - basicAuth: []
  /api/backlog/order:
    put:
      summary: バックログ並び替え
      operationId: put_api_backlog_order
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonValue'
      description: ' requestBody は暫定 JsonValue。変更時に具体化する。'
  /api/board:
    get:
      summary: ボード（列＋アイテム）
      operationId: get_api_board
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: プロジェクトで絞り込む（省略時はワークスペース全体）
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: 前回応答の ETag。一致すれば 304（projectId スコープ別）
      responses:
        '200':
          description: 成功
          headers:
            ETag:
              schema:
                type: string
              description: フィルタ後ボディの強い ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '304':
          description: 未変更（本文なし）。認証要否は 200 と同じ
          headers:
            ETag:
              schema:
