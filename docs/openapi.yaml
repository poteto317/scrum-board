components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sb_session
      description: アプリのセッション Cookie（SessionCookieName）。
    basicAuth:
      type: http
      scheme: basic
      description: users テーブルの login_name / password。Cookie が無いときミドルウェアが検証する（セッションは発行しない）。主に curl・エージェント等の非ブラウザ向けだが、`Sec-Fetch-Site` 付きのブラウザの Basic も同じく検証する。連続 5 回失敗でログイン名・接続元ごとに 15 分ロック（ログインとは別カウンタ）。ロック中は正しい資格情報でも 401（`sessionOptional` の経路は匿名扱い）。本番 nginx Basic（AUTH_*）とは別
    schedulerJobToken:
      type: apiKey
      in: header
      name: X-Scheduler-Token
      description: Cloud Scheduler 向け共有トークン（サーバ環境変数 SCHEDULER_JOB_TOKEN と一致）
  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
      additionalProperties: false
    ItemTemplate:
      type: object
      required:
      - id
      - projectId
      - name
      - titleTemplate
      - descriptionTemplate
      - position
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        name:
          type: string
        titleTemplate:
          type: string
        descriptionTemplate:
          type: string
        position:
          type: integer
      additionalProperties: false
    AIMessage:
      type: object
      required:
      - id
      - itemId
      - role
      - body
      - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        role:
          type: string
          enum:
          - user
          - assistant
        body:
          type: string
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    ProjectAIConversation:
      type: object
      description: プロジェクト AI チャットの 1 つの会話。常に呼び出したユーザー自身のもので、ユーザー ID は含めない。
      required:
      - id
      - projectId
      - title
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
          maxLength: 120
          description: |
            最初のメッセージから自動で付く（空白の並びを 1 つの空白にして、先頭の 40 文字。超えたら末尾に「…」）。
            会話ができる前からあった履歴を引き継いだ会話で、ユーザーのメッセージが無いものは「これまでの会話」。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: 最後にやりとりを保存した時刻。一覧の並びに使う。
      additionalProperties: false
    ProjectAIMessage:
      type: object
      description: プロジェクト AI チャットの 1 メッセージ。常に呼び出したユーザー自身のもので、ユーザー ID は含めない。
      required:
      - id
      - projectId
      - conversationId
      - role
      - body
      - createdAt
      properties:
        id:
          type: integer
        projectId:
          type: integer
        conversationId:
          type: integer
          description: このメッセージが属する会話の ID。
        role:
          type: string
          enum:
          - user
          - assistant
        body:
          type: string
        inputTokens:
          type: integer
          description: 回答にだけ付く。その回答のためのモデル呼び出し全部の合計。
        outputTokens:
          type: integer
        createdAt:
          type: string
          format: date-time
        proposals:
          type: array
          description: 回答（assistant）の提案。無ければ省略。読み直しに失敗して組み立てた応答には付かない。
          items:
            $ref: '#/components/schemas/ProjectAIProposal'
      additionalProperties: false
    ProjectAIProposal:
      type: object
      description: |
        AI の提案。モデルの提案のツールが作り、回答と一緒に保存される。アイテムは変えない（適用は画面が既存のアイテムの API を利用者の権限で呼ぶ）。
        status_change は itemNumber・itemTitle・columnId・columnName、description_edit は itemNumber・itemTitle・description・baseDescription（提案のときの説明）、
        item_create は title・description・columnId・columnName（常に Todo の列）と、適用後の createdItemNumber。名前とタイトルは表示用で、判定には ID と番号を使う。
      required:
      - id
      - messageId
      - kind
      - state
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
        messageId:
          type: integer
        kind:
          type: string
          enum:
          - status_change
          - description_edit
          - item_create
        state:
          type: string
          enum:
          - pending
          - applied
          - dismissed
        itemNumber:
          type: integer
        itemTitle:
          type: string
        columnId:
          type: integer
        columnName:
          type: string
        title:
          type: string
        description:
          type: string
        baseDescription:
          type: string
        createdItemNumber:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    AIError:
      type: object
      description: AI 関連の、code 付きのエラー。
      required:
      - message
      - code
      properties:
        message:
          type: string
        code:
          type: string
          enum:
          - unsupported_media_type
          - ai_not_configured
          - ai_credit_limit
          - ai_rate_limit
          - ai_busy
          - ai_failed
          - server_error
      additionalProperties: false
    AICredits:
      type: object
      required:
      - usedTokens
      - unlimited
      - approximate
      - period
      - configured
      properties:
        limitTokens:
          description: 上限。unlimited のとき null
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        usedTokens:
          type: integer
          minimum: 0
        remainingTokens:
          description: 残り。unlimited のとき null。超過時は 0
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        unlimited:
          type: boolean
        approximate:
          type: boolean
          description: 常に true（トークンは概算）
        period:
          type: string
          enum:
          - cumulative
        configured:
          type: boolean
          description: ANTHROPIC_API_KEY の有無
      additionalProperties: false
    DoubledTextRepairResponse:
      type: object
      required:
      - dryRun
      - scanned
      - descriptionRepaired
      - solutionRepaired
      - itemIds
      - repairs
      - warnings
      - failedItemIds
      properties:
        dryRun:
          type: boolean
        scanned:
          type: integer
          minimum: 0
        descriptionRepaired:
          type: integer
          minimum: 0
        solutionRepaired:
          type: integer
          minimum: 0
        itemIds:
          type: array
          items:
            type: integer
          description: 修復（予定）したアイテム ID。repairs から導出・昇順
        repairs:
          type: array
          items:
            type: object
            required:
            - itemId
            - field
            properties:
              itemId:
                type: integer
              field:
                type: string
                enum:
                - description
                - solution
            additionalProperties: false
        warnings:
          type: array
          items:
            type: string
          description: '警告。件数は配列長（例: fold limit reached）'
        failedItemIds:
          type: array
          items:
            type: integer
          description: Update に失敗したアイテム ID（dry-run では通常空）
      additionalProperties: false
    JsonValue:
      description: 当該エンドポイントの JSON 応答。フィールド詳細は必要に応じて本スキーマを具体化する。
    RecurringExpandableText:
      type: string
      description: >-
        保存時はテンプレートのまま。POST /api/recurring/run 起票時のみ展開。
        完全一致の {{weekStart}}（ルール TZ でその週の日曜、YYYY-MM-DD）と
        {{date}}（run の now のルール TZ ローカル日付、YYYY-MM-DD）のみ置換。
        空白入り・別ケース・未知の {{...}} は正規化せず残す（別トークンへマップしない）。
        展開後の title/description が長さ上限を超える場合は当該ルールが failed（起票しない）。
    RecurringRule:
      type: object
      required:
      - id
      - projectId
      - name
      - title
      - description
      - cron
      - timezone
      - columnId
      - enabled
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        title:
          $ref: '#/components/schemas/RecurringExpandableText'
        description:
          $ref: '#/components/schemas/RecurringExpandableText'
        cron:
          type: string
        timezone:
          type: string
        columnId:
          type: integer
        enabled:
          type: boolean
        lastFiredAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    RecurringRuleList:
      type: object
      required:
      - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RecurringRule'
      additionalProperties: false
    RecurringRuleCreate:
      type: object
      required:
      - name
      - title
      - cron
      - columnId
      properties:
        name:
          type: string
        title:
          $ref: '#/components/schemas/RecurringExpandableText'
        description:
          $ref: '#/components/schemas/RecurringExpandableText'
        cron:
          type: string
        timezone:
          type: string
        columnId:
          type: integer
        enabled:
          type: boolean
      additionalProperties: false
    RecurringRulePatch:
      type: object
      properties:
        name:
          type: string
        title:
          $ref: '#/components/schemas/RecurringExpandableText'
        description:
          $ref: '#/components/schemas/RecurringExpandableText'
        cron:
          type: string
        timezone:
          type: string
        columnId:
          type: integer
        enabled:
          type: boolean
      additionalProperties: false
    ItemComment:
      type: object
      required:
      - id
      - itemId
      - author
      - body
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        author:
          type: string
          description: 作成時の表示名スナップショット
        body:
          type: string
        createdByUserId:
          type: integer
          description: 作成者 users.id。移行前の行は省略または null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    Item:
      type: object
      description: アイテム JSON の主要フィールド。ACL 詳細は PATCH /acl を参照。
      properties:
        id:
          type: integer
        number:
          type: integer
        title:
          type: string
        description:
          type: string
        columnId:
          type: integer
        projectId:
          type: integer
        assignee:
          type: string
        favorite:
          type: boolean
        solution:
          type: string
        dueAt:
          type: string
          description: UTC。未設定は空文字または省略
        doneAt:
          type: string
          format: date-time
          nullable: true
          description: Done 列に入った時刻。Done 以外では null
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: アーカイブ日時。アクティブなアイテムでは null
        closeReason:
          type: string
        viewAccess:
          type: string
          enum:
          - public
          - open
          - restricted
        editAccess:
          type: string
          enum:
          - open
          - restricted
        prUrls:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
    Label:
      type: object
      required:
      - id
      - name
      - color
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
    ListFilter:
      type: object
      required:
      - query
      - statusIds
      properties:
        query:
          type: string
          maxLength: 200
        statusIds:
          type: array
          maxItems: 64
          items:
            type: integer
            minimum: 1
        labelIds:
          type: array
          maxItems: 64
          items:
            type: integer
            minimum: 1
          description: 省略時は空配列扱い（複数指定時は AND 絞り込み）
      additionalProperties: false
    WorkspaceListFilters:
      type: object
      required:
      - board
      - backlog
      properties:
        board:
          $ref: '#/components/schemas/ListFilter'
        backlog:
          $ref: '#/components/schemas/ListFilter'
      additionalProperties: false
