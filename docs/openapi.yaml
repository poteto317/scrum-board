      description: ' requestBody は暫定 JsonValue。変更時に具体化する。'
  /api/command-templates/apply-to-all-items:
    post:
      summary: 全アイテムの表示セット置換
      operationId: post_api_command_templates_apply_to_all_items
      responses:
        '204':
