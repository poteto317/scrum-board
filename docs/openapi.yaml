          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 閲覧権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 対象なし／他 item の id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
      - name: id
        in: path
        required: true
        schema:
          type: integer
      security: []
      description: セッション Cookie は任意（sessionOptional）。Cookie が無く非 public のアイテムは 401。`viewAccess=public`
        なら未ログインでも閲覧可。Cookie がある場合は ACL に従い 403 もありうる。ハンドラが強制する。
