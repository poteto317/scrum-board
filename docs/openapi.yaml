      description: |
        セッション＋編集可が必要。ANTHROPIC_API_KEY 未設定でも履歴は返す。
        古い順。この API は description／comments を変更しない。
      responses:
        '200':
          description: 履歴
          content:
            application/json:
              schema:
                type: object
                required:
                - messages
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIMessage'
                additionalProperties: false
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 編集不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: アイテムなし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
      - name: projectId
        in: query
        required: false
        schema:
          type: integer
        description: プロジェクト ID（省略時はアクティブ）
      security:
      - cookieAuth: []
      - basicAuth: []
    post:
      summary: アイテム AI チャット送信
      operationId: post_api_items_by_number_number_ai_chat
      description: |
        セッション＋編集可。キー未設定は 503。同時実行は refined と共有（超過 429 `ai_busy`）。
        アプリ内トークン上限到達時も 429（`ai_credit_limit`）。
        利用者別レート制限が有効なとき超過は 429（`ai_rate_limit`）。既定ではレート制限オフ。
        本文・コメントは変更しない。空／過長／未知フィールドは 400。
      responses:
        '200':
          description: アシスタント応答と更新後履歴
          content:
            application/json:
              schema:
                type: object
                required:
                - assistant
                - messages
                properties:
                  assistant:
                    $ref: '#/components/schemas/AIMessage'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIMessage'
                additionalProperties: false
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 編集不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: アイテムなし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type 不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            同時実行上限（code=ai_busy）、アプリ内トークン上限到達（code=ai_credit_limit）、
            または利用者別レート制限超過（code=ai_rate_limit。メッセージ「AIの利用頻度が高すぎます。少し待って再試行してください。」）。
            レート制限は `AI_RATE_LIMIT_PER_MINUTE` が正のときのみ有効（既定オフ）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: AI 上流失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AI 未設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
      - name: projectId
        in: query
        required: false
        schema:
          type: integer
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  description: |
                    1〜N Unicode 文字（既定 N=4000。サーバーの `AI_CHAT_MESSAGE_MAX` で上書き可）。
              additionalProperties: false
    delete:
      summary: アイテム AI チャット履歴クリア
      operationId: delete_api_items_by_number_number_ai_chat
