    patch:
      summary: プロジェクト AI チャットの提案の状態を変える
      operationId: patch_api_projects_id_ai_proposals_pid
      description: |
        ログインが必要。呼び出したユーザー自身の、そのプロジェクトの提案の状態だけを変える（アイテムは変えない。適用は画面が既存のアイテムの API で行う）。
        許す変更: pending→applied（確保）、pending→dismissed（破棄）、applied→pending（確保の解放。作成の結果の番号が無いときだけ）、
        applied→applied + createdItemNumber（item_create の結果の記録。1 回だけ）。それ以外は 409 で、本文に現在の提案。
        AI を呼ばないので、AI の利用制限・ANTHROPIC_API_KEY は関係しない。
        エラーの順序: 401 → 400／404（プロジェクト）→ 400（提案 ID・本文）→ 404（提案）→ 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  type: string
                  enum:
                  - pending
                  - applied
                  - dismissed
                createdItemNumber:
                  type: integer
                  minimum: 1
                  description: state が applied のときだけ。item_create を適用して作ったアイテムの番号。
              additionalProperties: false
      responses:
        '200':
          description: 変更後の提案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAIProposal'
        '400':
          description: 提案 ID が不正（「提案IDが不正です。」）、または本文が不正（「提案の状態が不正です。」）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            プロジェクトなし、または提案が見つからない（「提案が見つかりません。」）。無い・別のユーザーのもの・別のプロジェクトのもの、を区別しない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 今の状態からは変えられない（「この提案は既に処理されています。」）
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - proposal
                properties:
                  message:
                    type: string
                  proposal:
                    $ref: '#/components/schemas/ProjectAIProposal'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: プロジェクト ID
      - name: pid
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: 提案 ID
      security:
      - cookieAuth: []
      - basicAuth: []
