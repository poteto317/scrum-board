      - cookieAuth: []
      - basicAuth: []
    put:
      summary: AI 利用上限の設定／解除（admin）
      operationId: put_api_ai_credits
      description: admin のみ。limitTokens は必須キー。非負整数で設定、null で解除。キー無し・負数・非整数・未知フィールドは 400。成功は 200 で GET と同形。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - limitTokens
              properties:
                limitTokens:
                  description: 合計トークン上限。null で解除。
                  oneOf:
                  - type: integer
                    minimum: 0
                  - type: 'null'
              additionalProperties: false
      responses:
        '200':
