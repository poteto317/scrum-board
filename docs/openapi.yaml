    get:
      summary: 添付バイト取得
      operationId: get_api_items_by_number_number_attachments_id_content
      responses:
        '200':
          description: |
            バイナリ。画像 MIME は Content-Disposition 無し（インライン）。
            画像以外（application/pdf）は `Content-Disposition: attachment`（filename / filename*）。
          headers:
            ETag:
              schema:
                type: string
              description: 強い ETag（`"<添付ID>-<バイト数>"`）。内容は ID ごとに変わらない
            Cache-Control:
              schema:
                type: string
              description: private, max-age=3600
            Vary:
              schema:
                type: string
              description: Cookie, Authorization（別のセッションが前のキャッシュを使わない）
            Content-Disposition:
              schema:
                type: string
              description: 非画像のみ attachment; filename=…; filename*=UTF-8''…
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '304':
          description: 未変更（本文なし）。認証・権限・添付の存在確認は 200 と同じ（削除済み・他 item の id は 404）
          headers:
            ETag:
              schema:
                type: string
              description: 200 と同じ ETag
            Cache-Control:
              schema:
                type: string
              description: private, max-age=3600
            Vary:
              schema:
                type: string
              description: Cookie, Authorization
        '401':
          description: 未ログインかつ非 public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 閲覧権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 対象なし／他 item の id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: 前回応答の ETag。一致すれば 304
      security: []
      description: セッション Cookie は任意（sessionOptional）。有効な users Basic なら
        `CurrentUser` を付与。無効な Basic、またはロック中（連続 5 回失敗。`basicAuth` の説明を参照）の場合は匿名続行（middleware は 401 にしない）。
        Cookie が無く非 public のアイテムは 401。`viewAccess=public` なら未ログインでも閲覧可。Cookie がある場合は
        ACL に従い 403 もありうる。ハンドラが強制する。
