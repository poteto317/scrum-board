components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sb_session
      description: アプリのセッション Cookie（SessionCookieName）。
    basicAuth:
      type: http
      scheme: basic
      description: users テーブルの login_name / password。Cookie が無いときミドルウェアが検証する（セッションは発行しない）。`Sec-Fetch-Site` ヘッダが無い非ブラウザ（curl・エージェント等）向け。ブラウザは Cookie セッションを使う。本番 nginx Basic（AUTH_*）とは別
  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
      additionalProperties: false
    AIMessage:
      type: object
      required:
      - id
      - itemId
      - role
      - body
      - createdAt
      properties:
        id:
          type: integer
        itemId:
          type: integer
        role:
          type: string
          enum:
          - user
          - assistant
        body:
          type: string
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    AICredits:
      type: object
      required:
      - usedTokens
      - unlimited
      - approximate
      - period
      - configured
      properties:
        limitTokens:
          description: 上限。unlimited のとき null
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        usedTokens:
          type: integer
          minimum: 0
        remainingTokens:
          description: 残り。unlimited のとき null。超過時は 0
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        unlimited:
          type: boolean
        approximate:
          type: boolean
          description: 常に true（トークンは概算）
        period:
          type: string
          enum:
          - cumulative
        configured:
          type: boolean
          description: ANTHROPIC_API_KEY の有無
      additionalProperties: false
    JsonValue:
      description: 当該エンドポイントの JSON 応答。フィールド詳細は必要に応じて本スキーマを具体化する。
    Item:
      type: object
      description: アイテム JSON の主要フィールド。ACL 詳細は PATCH /acl を参照。
      properties:
        id:
          type: integer
        number:
          type: integer
        title:
          type: string
        description:
          type: string
        columnId:
          type: integer
        projectId:
          type: integer
        assignee:
          type: string
        favorite:
          type: boolean
        solution:
          type: string
        dueAt:
          type: string
          description: UTC。未設定は空文字または省略
        closeReason:
          type: string
        viewAccess:
          type: string
          enum:
          - public
          - open
          - restricted
        editAccess:
          type: string
          enum:
          - open
          - restricted
        prUrls:
          type: array
          items:
            type: string
