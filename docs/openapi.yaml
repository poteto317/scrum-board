openapi: 3.1.0
info:
  title: Scrum Board API
  version: 0.1.0
  description: 'スクラムかんばん HTTP API の契約正本。アプリ認証は Cookie `sb_session` または HTTP Basic（users テーブルの login_name / password、`Sec-Fetch-Site` ヘッダ無しの非ブラウザ向け）のどちらか。本番
    nginx の HTTP Basic はゲートウェイ層であり、operation の security には含めない。受け付けない入力は黙って別解釈へ落とさず 4xx 等で拒否する。v0.1.0:
    全 HTTP ルートの paths・認証（exempt/optional/必須）・主要 operation の request/response を載せる。未具体化の応答は JsonValue。当該 API
    を変更するときは update-api-doc スキルに従い JsonValue を具体 schema に置き換える。'
servers:
- url: http://127.0.0.1:4200
  description: ローカル（compose / フロント nginx 経由）。本番 Basic はゲートウェイ層。
paths:
  /api/auth/login:
    post:
      summary: ログイン（セッション Cookie 発行）
      operationId: post_api_auth_login
      responses:
        '200':
          description: 'ログイン成功（Set-Cookie: sb_session）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      description: セッション Cookie 不要（sessionExempt）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - loginName
              - password
              properties:
                loginName:
                  type: string
                password:
                  type: string
              additionalProperties: false
  /api/auth/logout:
    post:
      summary: ログアウト
      operationId: post_api_auth_logout
      responses:
        '204':
          description: ログアウト成功（本文なし。sessionExempt）
      security: []
      description: セッション Cookie 不要（sessionExempt）。
  /api/auth/me:
    get:
      summary: 現在のユーザー
      operationId: get_api_auth_me
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
      security:
      - cookieAuth: []
      - basicAuth: []
  /api/backlog:
    get:
      summary: バックログ
      operationId: get_api_backlog
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
      security:
      - cookieAuth: []
      - basicAuth: []
  /api/backlog/order:
    put:
      summary: バックログ並び替え
      operationId: put_api_backlog_order
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonValue'
      description: ' requestBody は暫定 JsonValue。変更時に具体化する。'
  /api/board:
    get:
      summary: ボード（列＋アイテム）
      operationId: get_api_board
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
      security:
      - cookieAuth: []
      - basicAuth: []
  /api/board/settings:
    patch:
      summary: ボード設定の部分更新
      operationId: patch_api_board_settings
      responses:
        '200':
          description: 成功。応答に items がある場合（free→pack など）は、呼び出し元が閲覧可能なアイテムのみを含む
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardLayout:
                  type: string
                  enum:
                  - pack
                  - free
                mobileBoardColumnId:
                  type: integer
                  nullable: true
              additionalProperties: false
  /api/columns:
    post:
      summary: 列作成
      operationId: post_api_columns
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 列名重複
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonValue'
      description: ' requestBody は暫定 JsonValue。変更時に具体化する。'
  /api/columns/order:
    put:
      summary: 列並び替え
      operationId: put_api_columns_order
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonValue'
      description: ' requestBody は暫定 JsonValue。変更時に具体化する。'
  /api/command-template-defaults:
    get:
      summary: 新規アイテム初期テンプレート
      operationId: get_api_command_template_defaults
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
      security:
      - cookieAuth: []
      - basicAuth: []
    put:
      summary: 新規アイテム初期テンプレート置換
      operationId: put_api_command_template_defaults
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonValue'
      description: ' requestBody は暫定 JsonValue。変更時に具体化する。'
  /api/command-templates:
    get:
      summary: コマンドテンプレート一覧
      operationId: get_api_command_templates
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
      security:
      - cookieAuth: []
      - basicAuth: []
    post:
      summary: コマンドテンプレート作成
      operationId: post_api_command_templates
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
