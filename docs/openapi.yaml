                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
  /api/columns:
    post:
      summary: 列作成
      operationId: post_api_columns
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
