        '304':
          description: 未変更（本文なし）
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
  /api/board/settings:
    patch:
      summary: ボード設定の部分更新
      operationId: patch_api_board_settings
      responses:
        '200':
          description: 成功。応答に items がある場合（free→pack など）は、呼び出し元が閲覧可能なアイテムのみを含む
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValue'
        '400':
          description: 不正な入力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardLayout:
                  type: string
                  enum:
                  - pack
                  - free
                mobileBoardColumnId:
                  type: integer
                  nullable: true
              additionalProperties: false
