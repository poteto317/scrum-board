name: scrum-board
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scrumboard
      MYSQL_USER: scrum
      MYSQL_PASSWORD: ${DB_PASSWORD:-scrum_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DB_ADDRESS: db:3306
      DB_USER: scrum
      DB_PASSWORD: ${DB_PASSWORD:-scrum_dev}
      DB_NAME: scrumboard
      LISTEN_ADDRESS: 0.0.0.0:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  mysql_data:
