# ローカル学習用。DBパスワード既定値（scrum_dev / root_dev_only）は開発専用で、
# 共有・公開ホストでは必ず変更すること。ポートは 127.0.0.1 のみ。APIに認証はない。
name: scrum-board
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scrumboard
      MYSQL_USER: scrum
      MYSQL_PASSWORD: ${DB_PASSWORD:-scrum_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DB_ADDRESS: db:3306
      DB_USER: scrum
      DB_PASSWORD: ${DB_PASSWORD:-scrum_dev}
      DB_NAME: scrumboard
      LISTEN_ADDRESS: 0.0.0.0:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    depends_on:
      - api
    restart: unless-stopped
  # ソース変更を自動反映する開発用画面（ng serve）。
  # 使い方: docker compose stop web && docker compose --profile dev up -d web-dev
  # または ./scripts/dev-web.sh
  web-dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Docker ボリューム越しの変更検知（@angular/build は --poll と組み合わせる）
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm ci && npm run start:docker"
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:4200"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  mysql_data:
  frontend_node_modules:
